name: CI

# The test suite is the thing that actually enforces SAFETY.md — the no-capture rule, the
# no-egress import allowlist, the free-forever routes, the contrast floor. Until now nothing
# ran it except a person remembering to. A guarantee that depends on somebody remembering is
# not a guarantee.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. This repository is public, so the default token's blast radius on a
# compromised action is a public repo's write surface. release.yml already sets this; ci.yml
# inherited the repo default and did not.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` and not `npm install`: the lockfile is committed, and installing instead of
      # ci-installing means the pinned versions are decorative.
      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # No jest, no transform. The suite imports lib/*.ts straight into .mjs files under bare
      # Node, which only works while lib/ stays free of React and the store — and that
      # constraint is itself asserted by one of the tests.
      - name: Test
        run: npm test

      # A build that typechecks and passes tests can still fail to bundle. Metro resolves
      # differently from tsc, and this is the cheapest place to find that out.
      - name: Web export
        run: npx expo export -p web --output-dir dist

      # PREFLIGHT RUNS HERE, not only in release.yml.
      #
      # scripts/preflight.mjs is 600 lines and nine gates, and it is the thing standing
      # between this repo and an App Review rejection — but its only wiring was release.yml,
      # a workflow that has never executed (no tags). So the orchestration, the disarm
      # detection and the exit-code arithmetic had no automated coverage at all, which is
      # precisely how a check that printed a clean tick for a comparison it never made
      # survived.
      #
      # Exit 1 is EXPECTED on this branch — the entity is unanswered and RevenueCat is
      # stubbed, both known and both tracked in docs/READINESS.md. What must not happen is
      # exit 2, which is preflight's own "this run was incomplete" code. Asserting that we
      # reach a real verdict proves the machinery ran without failing the branch on blockers
      # that are somebody's paperwork rather than somebody's commit.
      - name: Preflight runs and reaches a verdict
        run: |
          node scripts/preflight.mjs --offline || status=$?
          if [ "${status:-0}" = "2" ]; then
            echo "::error::preflight exited 2 — the run was incomplete, so nothing it printed can be trusted"
            exit 1
          fi
          echo "preflight completed with status ${status:-0}"

  legal-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # Builds with ALLOW_TODOS so an unfilled placeholder does not fail the branch — that is
      # a publishing gate, enforced in deploy-site.yml, not a reason to block development.
      - name: Build the legal site
        run: ALLOW_TODOS=1 node site/build.mjs
